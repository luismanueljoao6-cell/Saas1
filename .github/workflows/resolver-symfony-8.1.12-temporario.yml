name: Resolver temporário de dependências Symfony

on:
  push:
    branches:
      - security/symfony-8.1.12-20261127

permissions:
  contents: write

jobs:
  atualizar-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Obter código
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Preparar PHP e Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Atualizar apenas componentes Symfony afetados e dependências necessárias
        run: >-
          composer update
          symfony/http-foundation
          symfony/http-kernel
          symfony/mailer
          symfony/routing
          --with-all-dependencies
          --no-interaction
          --prefer-dist
          --no-progress

      - name: Validar manifesto, lock e advisories
        run: |
          composer validate --no-check-publish
          composer audit --locked

      - name: Guardar lockfile atualizado na branch
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          if git diff --quiet -- composer.lock; then
            echo "O Composer não produziu alterações no lockfile."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.lock
          git commit -m "chore(deps): corrigir advisories Symfony"
          git push origin "HEAD:${BRANCH_NAME}"

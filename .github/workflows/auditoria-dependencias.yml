name: Auditoria de dependências

# Audita Composer e npm separadamente do CI funcional. A execução agendada
# deteta avisos publicados depois do último commit.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

concurrency:
  group: auditoria-dependencias-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  composer-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, openssl, intl
          coverage: none

      # Audita o composer.lock tal como está: não instala nem atualiza nada.
      - run: composer audit --locked

  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      # Verifica que o lockfile permite instalação reproduzível sem executar
      # scripts de instalação de dependências no job de auditoria.
      - run: npm ci --ignore-scripts
      - run: npm audit

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qualidade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, openssl, pdo_sqlite, intl
          coverage: none

      - uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - run: composer validate --no-check-publish
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate
      # Lint incremental: o histórico já contém dívida de formatação em ficheiros
      # não alterados por esta PR. Não bloquear alterações novas por essa dívida.
      - name: Pint nos ficheiros PHP alterados
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            git fetch origin "$BASE_REF" --depth=1
            mapfile -t ficheiros < <(git diff --name-only "FETCH_HEAD...HEAD" -- '*.php')
          else
            mapfile -t ficheiros < <(git diff --name-only HEAD^ HEAD -- '*.php')
          fi
          if (("${#ficheiros[@]}")); then
            vendor/bin/pint --test "${ficheiros[@]}"
          else
            echo "Nenhum ficheiro PHP alterado."
          fi
      # Os testes de auditoria de subscrições são executados numa etapa própria.
      - run: php artisan test --exclude-group=auditoria
      - run: php artisan test --group=auditoria --exclude-group=auditoria-retomar
      - run: php artisan test --group=auditoria-retomar
      - run: composer audit

  testes-mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: saas_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: saas_test
      DB_USERNAME: root
      DB_PASSWORD: root
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, openssl, pdo_mysql, intl
          coverage: none

      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate
      # Triggers de imutabilidade, locks e snapshots só se testam em MySQL.
      - run: php artisan test --exclude-group=auditoria
      - run: php artisan test --group=auditoria --exclude-group=auditoria-retomar
      - run: php artisan test --group=auditoria-retomar

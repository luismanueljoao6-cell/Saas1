version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # Mantém as actions fixadas por SHA atualizadas.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
